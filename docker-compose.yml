# Local Kostra development database only.
# Do not point this file at Railway Monitor or any remote database.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rmo-kostra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rmo_kostra_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/02-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: rmo-kostra-livekit
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  # Phase 6 — optional AI frame consumer. Does not own live WebRTC calls.
  ai-service:
    build:
      context: ./ai-service
    container_name: rmo-kostra-ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-ai-service-token}
      AI_FRAME_INTERVAL_MS: ${AI_FRAME_INTERVAL_MS:-1000}
      AI_DEV_TEST_STREAM: ${AI_DEV_TEST_STREAM:-false}
      AI_MAX_FRAME_BYTES: ${AI_MAX_FRAME_BYTES:-512000}
    ports:
      - "${AI_SERVICE_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
