name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          name="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "ai=${name}-ai-service" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=http://35.154.102.7:3000
            NEXT_PUBLIC_FILE_STORAGE_DRIVER=s3
            NEXT_PUBLIC_S3_PUBLIC_BASE_URL=https://techmen-rmo-public.s3.ap-south-1.amazonaws.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI service
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          file: ai-service/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.ai }}:latest
            ${{ steps.image.outputs.ai }}:${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RMO_IMAGE,RMO_AI_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/rmo
            git fetch origin main
            git reset --hard origin/main
            bash scripts/server-deploy.sh
        env:
          RMO_IMAGE: ${{ steps.image.outputs.name }}:latest
          RMO_AI_IMAGE: ${{ steps.image.outputs.ai }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
